<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>태아 성장 드래그 게임 (최종 수정)</title>
  <style>
    body {
      font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #game {
      width: 960px;
      margin: 20px auto;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      padding: 24px 32px 32px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
      color: #444;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
    }

    #mother-area {
      position: relative;
      width: 100%;
      height: 300px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffe5f2, #e7f3ff);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #mother {
      position: relative;
      width: 220px;
      height: 260px;
      background: #ffd1c1;
      border-radius: 110px 110px 90px 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    #mother::before {
      content: "";
      position: absolute;
      top: -90px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 130px;
      background: #ffe3cf;
      border-radius: 50%;
      box-shadow: 0 6px 0 rgba(0,0,0,0.03);
    }

    #mother::after {
      content: "";
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 110px;
      background: #7a4b3a;
      border-radius: 90px 90px 60px 60px;
    }

    #belly {
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      border: 4px solid #ff99b5;
      display: flex;
      align-items: center;
      justify-content: center;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      transition: width 0.3s ease, height 0.3s ease, border-width 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 18px rgba(255, 153, 181, 0.45);
      overflow: hidden;
      z-index: 2;
    }

    #belly-label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #ff5b7b;
      font-weight: 700;
      text-shadow: 0 1px 2px rgba(255,255,255,0.9);
      z-index: 3;
    }

    #belly-img {
      max-width: 100%;
      max-height: 100%;
      display: none;
    }

    #fetus-strip-title {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      color: #555;
      text-align: left;
    }

    #fetus-container {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .fetus {
      background: #fff8fb;
      border-radius: 16px;
      border: 2px dashed #ffb4cc;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-style 0.15s ease;
      padding: 4px;
      box-sizing: border-box;
    }

    .fetus:active {
      cursor: grabbing;
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .fetus-label {
      font-size: 15px;
      font-weight: 600;
      color: #ff5b7b;
      margin-bottom: 4px;
    }

    .fetus-img {
      flex: 1;
      max-height: 80px;
      max-width: 80px;
      object-fit: contain;
    }

    #drop-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgba(80, 60, 80, 0.7);
      background: rgba(255,255,255,0.8);
      padding: 4px 10px;
      border-radius: 999px;
      z-index: 4;
    }

    #controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #current-info {
      font-size: 14px;
      color: #555;
    }

    #reset-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #ff8fb0;
      color: #ffffff;
      box-shadow: 0 6px 12px rgba(255, 143, 176, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    #reset-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(255, 143, 176, 0.6);
      background: #ff749d;
    }

    #reset-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(255, 143, 176, 0.4);
    }

    @media (max-width: 980px) {
      body {
        align-items: stretch;
      }
      #game {
        width: 100%;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
        height: 100vh;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
  <div id="game">
    <h1>엄마 뱃속 태아 성장 게임</h1>
    <div class="subtitle">개월별 태아 그림을 엄마에게 드래그해서 옮기면, 엄마 배 안에 태아가 보이고 크기도 함께 자라요.</div>

    <div id="mother-area">
      <div id="mother"></div>
      <div id="belly-label">0개월</div>
      <div id="belly">

      </div>
      <div id="drop-hint">여기에 태아를 끌어다 놓으세요</div>
    </div>

    <div id="controls">
      <div id="current-info">현재 선택: 없음</div>
      <button id="reset-btn">리셋</button>
    </div>
  </div>

  <script>
    (function() {
      var fetusCards = document.querySelectorAll(".fetus");
      var motherArea = document.getElementById("mother-area");
      var belly = document.getElementById("belly");
      var bellyImg = document.getElementById("belly-img");
      var bellyLabel = document.getElementById("belly-label");
      var currentInfo = document.getElementById("current-info");
      var dropHint = document.getElementById("drop-hint");
      var resetBtn = document.getElementById("reset-btn");

      // 드래그 시작: 개월 수를 dataTransfer에 넣기
      for (var i = 0; i < fetusCards.length; i++) {
        (function(card) {
          card.addEventListener("dragstart", function(event) {
            var month = card.getAttribute("data-month");
            event.dataTransfer.setData("text", month);
          });
        })(fetusCards[i]);
      }

      // 드롭 가능 영역 허용
      motherArea.addEventListener("dragover", function(event) {
        event.preventDefault();
      });

      // 드롭 처리
      motherArea.addEventListener("drop", function(event) {
        event.preventDefault();
        var monthStr = event.dataTransfer.getData("text");
        if (!monthStr) return;
        var month = parseInt(monthStr, 10);
        if (isNaN(month)) return;

        var card = document.querySelector('.fetus[data-month="' + month + '"]');
        if (!card) return;
        var img = card.querySelector("img");
        if (img) {
          bellyImg.src = img.src;
          bellyImg.style.display = "block";
        }

        var minSize = 120;
        var maxSize = 240;
        var size = minSize + (month - 1) * ((maxSize - minSize) / 9);

        belly.style.width = size + "px";
        belly.style.height = size + "px";
        belly.style.borderWidth = (3 + month * 0.2) + "px";

        bellyLabel.textContent = month + "개월";
        currentInfo.textContent = "현재 선택: " + month + "개월 태아";
        dropHint.textContent = "다른 개월 수도 다시 올려볼 수 있어요";
      });

      resetBtn.addEventListener("click", function() {
        belly.style.width = "120px";
        belly.style.height = "120px";
        belly.style.borderWidth = "4px";
        bellyImg.src = "";
        bellyImg.style.display = "none";
        bellyLabel.textContent = "0개월";
        currentInfo.textContent = "현재 선택: 없음";
        dropHint.textContent = "여기에 태아를 끌어다 놓으세요";
      });
    })();
  </script>
